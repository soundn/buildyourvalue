<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ladda mark: a ladder climbing to the right">
  <defs>
    <clipPath id="r"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0F6B3A"/>
  <g clip-path="url(#r)">
